name: Create Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: 25.0.4+101.0.LTS
          distribution: 'temurin'
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        run: |
          python -m pip install --only-binary :all: --require-hashes -r requirements.txt
      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle
      - name: Create Maven Central repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./gradlew createRepoForUploadToMavenCentral \
            -PreleaseVersion="${RELEASE_TAG#v}" \
            --info
      - name: Verify Maven Central repository bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test -f "build/mavencentral/hash4j-${RELEASE_TAG#v}-maven-central-bundle.zip"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --draft --generate-notes --verify-tag
      - name: Add Maven Central repository to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "build/mavencentral/hash4j-${RELEASE_TAG#v}-maven-central-bundle.zip"
