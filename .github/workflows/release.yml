name: Release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Create Maven Central repository
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: 25.0.4+101.0.LTS
          distribution: 'temurin'
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        run: |
          python -m pip install --only-binary :all: --require-hashes -r requirements.txt
      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle
      - name: Create Maven Central repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          ./gradlew createRepoForUploadToMavenCentral \
            -PreleaseVersion="${RELEASE_TAG#v}" \
            --info
      - name: Add Maven Central repository to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          bundle_path="build/mavencentral/hash4j-${RELEASE_TAG#v}-maven-central-bundle.zip"
          if ! upload_output=$(gh release upload "$RELEASE_TAG" "$bundle_path" --clobber 2>&1); then
            if grep -qi "immutable release" <<<"$upload_output"; then
              echo "Skipping upload because the release is immutable."
              echo "$upload_output"
            else
              echo "$upload_output" >&2
              exit 1
            fi
          fi
